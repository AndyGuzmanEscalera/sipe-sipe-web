name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          GITHUB_ACTIONS: true
          # URL pública del backend de Sipe Sipe Gestión.
          # Configurar en Settings > Secrets and variables > Actions > Variables
          # (o como Secret). Si no se define, el sitio se construye con los
          # datos de respaldo y la Gaceta queda sin conexión con la API.
          PUBLIC_GESTION_API_URL: ${{ vars.PUBLIC_GESTION_API_URL || secrets.PUBLIC_GESTION_API_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
